<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RACE TIMER</title>
<style>
  :root{
    --bg1:#0a1128; --bg2:#1b2a5c;
    --gold:#e8b93f; --gold-soft:#f2cf6d;
    --silver:#c7cfe6; --bronze:#cd8b4a;
    --green:#33c17a; --red:#e6564a;
    --card:#141f45; --card-border:rgba(232,185,63,0.22);
    --text:#f2f4fb; --text-dim:#9aa4c7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:radial-gradient(circle at 50% -10%, var(--bg2), var(--bg1) 60%);
    color:var(--text); min-height:100vh; padding-bottom:26px;
  }
  .app{max-width:560px; margin:0 auto; padding:18px 14px 10px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  h1.title{font-size:22px; letter-spacing:1.5px; font-weight:900; margin:0; flex:1; text-align:center;}
  .subtitle{text-align:center; color:var(--text-dim); font-size:13px; margin:4px 0 18px;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; background:var(--card); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:16px; cursor:pointer;
  }
  .icon-btn:active{transform:scale(0.92);}

  /* ---------- setup screen ---------- */
  .setup-card{
    background:linear-gradient(160deg, var(--card), #0e1836);
    border:1px solid var(--card-border); border-radius:16px;
    padding:16px; margin-bottom:12px;
  }
  .setup-station-name{font-size:17px; font-weight:800; margin-bottom:4px;}
  .setup-players{color:var(--text-dim); font-size:12.5px; margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap;}
  .player-chip{background:rgba(232,185,63,0.12); color:var(--gold-soft); padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--card-border);
    background:#0f1938; color:var(--text); font-size:16px; text-align:center; font-variant-numeric:tabular-nums;
  }
  .stage-toggle{display:flex; gap:8px;}
  .stage-opt{
    flex:1; padding:10px 0; text-align:center; border-radius:10px; background:#0f1938;
    border:1px solid var(--card-border); cursor:pointer; font-weight:700; font-size:13px;
  }
  .stage-opt.active{background:var(--gold); color:#2a1c00; border-color:var(--gold);}
  .start-btn{
    width:100%; padding:16px 0; border-radius:14px; border:none; margin-top:8px;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold)); color:#2a1c00;
    font-size:18px; font-weight:900; cursor:pointer;
  }
  .start-btn:active{transform:scale(0.98);}

  /* ---------- race banner ---------- */
  .race-banner{
    text-align:center; background:rgba(232,185,63,0.12); border:1px solid var(--card-border);
    border-radius:14px; padding:12px; margin-bottom:14px; font-weight:800; color:var(--gold-soft); font-size:15px;
  }
  .race-banner.done{background:rgba(51,193,122,0.14); border-color:rgba(51,193,122,0.5); color:var(--green);}

  /* ---------- player row card ---------- */
  .player-card{
    background:linear-gradient(160deg, var(--card), #0e1836);
    border:1px solid var(--card-border); border-radius:16px;
    padding:14px 16px 16px; margin-bottom:12px; transition:border-color .2s;
  }
  .player-card.finished{border-color:rgba(51,193,122,0.5);}
  .row-top{display:flex; align-items:center; gap:10px;}
  .index-pill{
    width:28px; height:28px; border-radius:8px; background:rgba(232,185,63,0.14); color:var(--gold-soft);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0;
  }
  .name-block{flex:1; min-width:0;}
  .player-name{font-size:17px; font-weight:800; line-height:1.15;}
  .station-name{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

  .mid-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .time-display{font-size:34px; font-weight:900; letter-spacing:0.5px; font-variant-numeric:tabular-nums;}
  .stage-tag{background:rgba(232,185,63,0.13); color:var(--gold-soft); font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap;}

  .status-row{display:flex; align-items:center; gap:8px; margin-top:8px; min-height:32px;}
  .diff-badge{font-size:12px; font-weight:800; padding:5px 10px; border-radius:999px; display:none;}
  .diff-badge.ahead{display:inline-block; background:rgba(51,193,122,0.15); color:var(--green);}
  .diff-badge.behind{display:inline-block; background:rgba(230,86,74,0.15); color:var(--red);}
  .provisional-tag{font-size:10.5px; color:var(--text-dim); font-style:italic;}
  .rank-circle{
    width:32px; height:32px; border-radius:50%; display:none; align-items:center; justify-content:center;
    font-weight:900; font-size:14px; margin-inline-start:auto;
  }
  .rank-circle.show{display:flex;}
  .rank-circle.r1{background:var(--gold); color:#2a1c00;}
  .rank-circle.r2{background:var(--silver); color:#1c2140;}
  .rank-circle.r3{background:var(--bronze); color:#2a1400;}

  .finish-btn{
    width:100%; margin-top:12px; padding:14px 0; border-radius:12px; border:none;
    background:var(--red); color:#2a0704; font-size:15px; font-weight:800; cursor:pointer;
  }
  .finish-btn:active{transform:scale(0.97);}
  .finish-btn.stage1{background:rgba(232,185,63,0.9); color:#2a1c00;}
  .done-label{
    width:100%; margin-top:12px; padding:12px 0; border-radius:12px; text-align:center;
    background:rgba(51,193,122,0.1); color:var(--green); font-weight:800; font-size:14px;
  }
  .kbd-hint{text-align:center; color:var(--text-dim); font-size:11.5px; margin-top:6px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ================= DATA ================= */
const STORAGE_KEY = 'race_timer_data_v3';

const defaultStations = [
  { id:'visual',        name:'Visual Inspection',    players:[{id:'gharib',  name:'m.gharib'}],  japanTime:45.0, stages:1 },
  { id:'cc-inspect',    name:'C&C Inspection',       players:[{id:'kazlak',  name:'m.kazlak'}],  japanTime:45.0, stages:1 },
  { id:'assembly1',     name:'Assembly 1',           players:[{id:'youssef', name:'Youssef'},{id:'ziad', name:'ziad'}], japanTime:45.0, stages:1 },
  { id:'assembly-maint',name:'Assembly Maintenance', players:[{id:'moaty',   name:'m.moaty'}],   japanTime:45.0, stages:1 },
  { id:'cc-maint',      name:'C&C Maintenance',      players:[{id:'hefny',   name:'m.hefny'}],   japanTime:45.0, stages:1 },
];

function loadStations(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultStations));
}
function saveStations(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(stations)); }

let stations = loadStations();

const rows = [];
function rebuildRows(){
  rows.length = 0;
  stations.forEach(st=>{
    st.players.forEach(p=>{
      rows.push({ stationId: st.id, playerId: p.id, playerName: p.name, stationName: st.name });
    });
  });
  rows.forEach((r,i)=> r.index = i+1);
}
rebuildRows();

/* runtime state */
let phase = 'setup'; // 'setup' | 'race'
let raceStartTs = 0;
const runtime = {}; // key -> {stage, stage1Split, finished, finishTime, rank, provisional}
function rtKey(stationId, playerId){ return stationId+'::'+playerId; }
function getRT(stationId, playerId){
  const k = rtKey(stationId, playerId);
  if(!runtime[k]) runtime[k] = { stage:1, stage1Split:null, finished:false, finishTime:null, rank:null, provisional:false };
  return runtime[k];
}
function resetRuntime(){
  rows.forEach(r=>{ runtime[rtKey(r.stationId,r.playerId)] = { stage:1, stage1Split:null, finished:false, finishTime:null, rank:null, provisional:false }; });
}
resetRuntime();

let tickInterval = null;

/* ================= HELPERS ================= */
function fmtTime(totalSeconds){
  if(totalSeconds < 0) totalSeconds = 0;
  const m = Math.floor(totalSeconds/60);
  const s = Math.floor(totalSeconds%60);
  const cs = Math.floor((totalSeconds*100)%100);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}
function parseTime(str){
  if(!str) return 0;
  str = str.trim();
  let m=0, rest=str;
  if(str.includes(':')){ const p = str.split(':'); m = parseFloat(p[0])||0; rest = p[1]||'0'; }
  const s = parseFloat(rest)||0;
  return m*60+s;
}
function getStation(stationId){ return stations.find(s=>s.id===stationId); }
function liveElapsed(){ return (performance.now() - raceStartTs)/1000; }

/* ================= RANKING ================= */
function recomputeRanking(stationId){
  const st = getStation(stationId);
  const stRows = rows.filter(r=>r.stationId===stationId);
  if(st.players.length === 1){
    const r = stRows[0];
    const rt = getRT(r.stationId, r.playerId);
    if(rt.finished){
      rt.rank = rt.finishTime < st.japanTime ? 1 : 2;
      rt.provisional = false;
    }
    return;
  }
  // two-player station (assembly1)
  const rts = stRows.map(r=>({ r, rt:getRT(r.stationId, r.playerId) }));
  const finishedCount = rts.filter(x=>x.rt.finished).length;
  if(finishedCount === 0) return;
  if(finishedCount < rts.length){
    // provisional: rank vs japan only
    rts.forEach(x=>{
      if(x.rt.finished){
        x.rt.rank = x.rt.finishTime < st.japanTime ? 1 : 2;
        x.rt.provisional = true;
      }
    });
  } else {
    // full 3-way ranking
    const entries = rts.map(x=>({ key:x.r.playerId, time:x.rt.finishTime }));
    entries.push({ key:'__japan__', time: st.japanTime });
    entries.sort((a,b)=>a.time-b.time);
    entries.forEach((e,i)=>{
      if(e.key==='__japan__') return;
      const target = rts.find(x=>x.r.playerId===e.key);
      target.rt.rank = i+1;
      target.rt.provisional = false;
    });
  }
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = phase === 'setup' ? renderSetup() : renderRace();
}

function renderSetup(){
  let html = `
    <div class="topbar"><h1 class="title">RACE TIMER</h1></div>
    <div class="subtitle">إعداد المسابقة — حدد رقم اليابان لكل لعبة قبل البدء</div>
  `;
  stations.forEach(st=>{
    const chips = st.players.map(p=>`<span class="player-chip">${p.name}</span>`).join('');
    html += `
      <div class="setup-card">
        <div class="setup-station-name">${st.name}</div>
        <div class="setup-players">${chips}</div>
        <div class="field">
          <label>رقم اليابان (دقيقة:ثانية.جزء)</label>
          <input type="text" id="japan-${st.id}" value="${fmtTime(st.japanTime)}">
        </div>
        <div class="field">
          <label>عدد المراحل</label>
          <div class="stage-toggle">
            <div class="stage-opt ${st.stages===1?'active':''}" onclick="setStage('${st.id}',1)" id="stage1-${st.id}">مرحلة واحدة</div>
            <div class="stage-opt ${st.stages===2?'active':''}" onclick="setStage('${st.id}',2)" id="stage2-${st.id}">مرحلتين</div>
          </div>
        </div>
      </div>
    `;
  });
  html += `<button class="start-btn" onclick="startRace()">🏁 بدء المسابقة</button>`;
  html += `<div class="kbd-hint">ENTER = بدء المسابقة</div>`;
  return html;
}

function renderRace(){
  const allDone = rows.every(r=> getRT(r.stationId,r.playerId).finished);
  let html = `
    <div class="topbar">
      <div class="icon-btn" onclick="restartRace()" title="ريستارت">↺</div>
      <h1 class="title">RACE TIMER</h1>
      <div class="icon-btn" onclick="backToSetup()" title="الإعدادات">⚙</div>
    </div>
    <div class="race-banner ${allDone?'done':''}">${allDone ? '🏁 انتهت المسابقة — كل المتسابقين خلصوا' : 'السباق جارٍ... كل لاعب يضغط زراره عند الانتهاء'}</div>
  `;

  rows.forEach(r=>{
    const st = getStation(r.stationId);
    const rt = getRT(r.stationId, r.playerId);
    const displayTime = rt.finished ? rt.finishTime : (rt.stage===2 && rt.stage1Split!==null ? liveElapsed() : liveElapsed());
    const stageLabel = st.stages===2 ? (rt.finished ? 'انتهى' : (rt.stage===1 ? 'Stage 1/2' : 'Stage 2/2')) : (rt.finished?'انتهى':'جارٍ');

    let diffBadge = '';
    let rankCircle = '';
    if(rt.finished && rt.rank !== null){
      const diff = st.japanTime - rt.finishTime;
      const ahead = diff >= 0;
      diffBadge = `<span class="diff-badge ${ahead?'ahead':'behind'}">${ahead?'−':'+'}${Math.abs(diff).toFixed(2)}s${rt.provisional?' *':''}</span>`;
      const rc = rt.rank===1?'r1':(rt.rank===2?'r2':'r3');
      rankCircle = `<div class="rank-circle show ${rc}">${rt.rank}</div>`;
    }

    let actionHtml = '';
    if(!rt.finished){
      const label = (st.stages===2 && rt.stage===1) ? `إنهاء المرحلة 1 — لاعب #${r.index}` : `إنهاء — لاعب #${r.index}`;
      const cls = (st.stages===2 && rt.stage===1) ? 'finish-btn stage1' : 'finish-btn';
      actionHtml = `<button class="${cls}" onclick="pressRow(${r.index})">${label}</button>`;
    } else {
      actionHtml = `<div class="done-label">✅ انتهى</div>`;
    }

    html += `
      <div class="player-card ${rt.finished?'finished':''}">
        <div class="row-top">
          <div class="index-pill">${r.index}</div>
          <div class="name-block">
            <div class="player-name">${r.playerName}</div>
            <div class="station-name">${r.stationName}</div>
          </div>
        </div>
        <div class="mid-row">
          <div class="time-display" id="timer-${r.stationId}-${r.playerId}">${fmtTime(displayTime)}</div>
          <div class="stage-tag">${stageLabel}</div>
        </div>
        <div class="status-row">
          ${diffBadge}
          ${rt.provisional ? '<span class="provisional-tag">مبدئي</span>' : ''}
          ${rankCircle}
        </div>
        ${actionHtml}
      </div>
    `;
  });

  html += `<div class="kbd-hint">1-${rows.length} = إنهاء اللاعب المطابق &nbsp;|&nbsp; R = ريستارت</div>`;
  return html;
}

/* ================= ACTIONS ================= */
function setStage(stationId, n){
  const st = getStation(stationId);
  st.stages = n;
  render();
}

function startRace(){
  stations.forEach(st=>{
    const input = document.getElementById('japan-'+st.id);
    if(input) st.japanTime = parseTime(input.value);
  });
  saveStations();
  rebuildRows();
  resetRuntime();
  raceStartTs = performance.now();
  phase = 'race';
  render();
  ensureTicker();
}

function pressRow(index){
  const r = rows[index-1];
  if(!r) return;
  const st = getStation(r.stationId);
  const rt = getRT(r.stationId, r.playerId);
  if(rt.finished) return;
  const now = liveElapsed();
  if(st.stages === 2 && rt.stage === 1){
    rt.stage1Split = now;
    rt.stage = 2;
  } else {
    rt.finished = true;
    rt.finishTime = now;
    recomputeRanking(r.stationId);
  }
  render();
}

function restartRace(){
  resetRuntime();
  raceStartTs = performance.now();
  render();
  ensureTicker();
}

function backToSetup(){
  if(!confirm('هل تريد الرجوع للإعدادات؟ سيتم إيقاف السباق الحالي.')) return;
  phase = 'setup';
  if(tickInterval){ clearInterval(tickInterval); tickInterval=null; }
  render();
}

function ensureTicker(){
  if(tickInterval) return;
  tickInterval = setInterval(()=>{
    if(phase !== 'race') return;
    rows.forEach(r=>{
      const rt = getRT(r.stationId, r.playerId);
      if(!rt.finished){
        const el = document.getElementById('timer-'+r.stationId+'-'+r.playerId);
        if(el) el.textContent = fmtTime(liveElapsed());
      }
    });
  }, 40);
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown', (e)=>{
  if(phase === 'setup'){
    if(e.key === 'Enter') startRace();
    return;
  }
  if(e.key >= '1' && e.key <= '9'){
    const idx = parseInt(e.key,10);
    if(idx <= rows.length) pressRow(idx);
  } else if(e.key === '0' || e.key.toLowerCase() === 'r'){
    restartRace();
  }
});

/* ================= INIT ================= */
render();
</script>
</body>
</html>
