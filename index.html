<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RACE TIMER</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#0a1128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RACE TIMER">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg1:#0a1128; --bg2:#1b2a5c;
    --gold:#e8b93f; --gold-soft:#f2cf6d;
    --silver:#c7cfe6; --bronze:#cd8b4a;
    --green:#33c17a; --red:#e6564a;
    --card:#141f45; --card-border:rgba(232,185,63,0.22);
    --text:#f2f4fb; --text-dim:#9aa4c7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:radial-gradient(circle at 50% -10%, var(--bg2), var(--bg1) 60%);
    color:var(--text); min-height:100vh; padding-bottom:26px; overflow-x:hidden;
  }
  .app{max-width:560px; margin:0 auto; padding:14px 12px 10px;}

  /* landscape hack */
  body.landscape-mode{overflow:hidden;}
  body.landscape-mode .app{
    position:fixed; top:0; left:0;
    width:100vh; height:100vw;
    transform:rotate(90deg) translateY(-100%);
    transform-origin:top left;
    overflow-y:auto; max-width:none;
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px;}
  h1.title{font-size:19px; letter-spacing:1px; font-weight:900; margin:0; flex:1; text-align:center;}
  .icon-btn{
    width:36px; height:36px; border-radius:10px; background:var(--card); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn.exit{color:var(--red);}

  .race-banner{
    text-align:center; background:rgba(232,185,63,0.12); border:1px solid var(--card-border);
    border-radius:12px; padding:10px; margin-bottom:10px; font-weight:800; color:var(--gold-soft); font-size:13.5px;
  }
  .race-banner.done{background:rgba(51,193,122,0.14); border-color:rgba(51,193,122,0.5); color:var(--green);}

  .enter-btn{
    width:100%; padding:16px 0; border-radius:14px; border:none; margin-bottom:12px;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold)); color:#2a1c00;
    font-size:17px; font-weight:900; cursor:pointer;
  }
  .enter-btn:active{transform:scale(0.98);}
  .enter-btn[disabled]{opacity:0.35; pointer-events:none;}

  /* ---------- compact row ---------- */
  .row-group{margin-bottom:2px;}
  .row-divider{border:none; border-top:1px solid var(--card-border); margin:10px 0;}
  .prow{
    background:linear-gradient(160deg, var(--card), #0e1836);
    border:1px solid var(--card-border); border-radius:12px;
    padding:10px 12px; margin-bottom:6px;
  }
  .prow.finished{border-color:rgba(51,193,122,0.45);}
  .prow.same-game{border-top-left-radius:0; border-top-right-radius:0; margin-top:-4px;}
  .prow-line1{display:flex; align-items:baseline; gap:6px; font-size:15px; font-weight:800; flex-wrap:wrap;}
  .prow-line1 .idx{color:var(--gold-soft); font-size:13px;}
  .prow-line1 .station{color:var(--text-dim); font-size:12px; font-weight:600;}
  .prow-line2{display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; font-variant-numeric:tabular-nums;}
  .ptime{font-size:22px; font-weight:900;}
  .psec{font-size:12px; color:var(--text-dim);}
  .diff-badge{font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; display:none;}
  .diff-badge.ahead{display:inline-block; background:rgba(51,193,122,0.15); color:var(--green);}
  .diff-badge.behind{display:inline-block; background:rgba(230,86,74,0.15); color:var(--red);}
  .rank-tag{font-size:12px; font-weight:900; padding:3px 9px; border-radius:999px; display:none;}
  .rank-tag.show{display:inline-block;}
  .rank-tag.r1{background:var(--gold); color:#2a1c00;}
  .rank-tag.r2{background:var(--silver); color:#1c2140;}
  .rank-tag.r3{background:var(--bronze); color:#2a1400;}
  .provisional-tag{font-size:10px; color:var(--text-dim); font-style:italic;}
  .stage-tag{font-size:11px; color:var(--gold-soft); background:rgba(232,185,63,0.13); padding:3px 8px; border-radius:999px;}

  .finish-btn{
    margin-top:8px; width:100%; padding:10px 0; border-radius:9px; border:none;
    background:var(--red); color:#2a0704; font-size:13.5px; font-weight:800; cursor:pointer;
  }
  .finish-btn:active{transform:scale(0.96);}
  .finish-btn.stage1{background:rgba(232,185,63,0.9); color:#2a1c00;}
  .done-label{margin-top:8px; text-align:center; color:var(--green); font-weight:800; font-size:12.5px;}
  .quality-row{display:flex; gap:8px; margin-top:8px;}
  .quality-row input{
    padding:9px 10px; border-radius:9px; border:1px solid var(--card-border);
    background:#0f1938; color:var(--text); font-size:13px;
  }
  .quality-input{width:38%; text-align:center;}
  .comment-input{flex:1;}
  .export-btn{
    width:100%; padding:14px 0; border-radius:12px; border:none; margin:6px 0 12px;
    background:linear-gradient(160deg, #3ddc97, #1fae74); color:#04220f;
    font-size:15px; font-weight:800; cursor:pointer;
  }
  .export-btn:active{transform:scale(0.98);}

  .kbd-hint{text-align:center; color:var(--text-dim); font-size:11px; margin-top:10px;}

  /* ---------- modal (settings / exit) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,7,20,0.75);
    display:none; align-items:flex-end; justify-content:center; z-index:60;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--bg2); width:100%; max-width:560px;
    border-radius:20px 20px 0 0; padding:20px 18px 26px;
    border-top:1px solid var(--card-border); max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 14px; font-size:16px; text-align:center;}
  .set-card{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .set-station-name{font-weight:800; font-size:14px; margin-bottom:8px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:4px;}
  .field input{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--card-border);
    background:#0f1938; color:var(--text); font-size:14px; text-align:center; font-variant-numeric:tabular-nums;
  }
  .stage-toggle{display:flex; gap:6px;}
  .stage-opt{flex:1; padding:8px 0; text-align:center; border-radius:8px; background:#0f1938; border:1px solid var(--card-border); cursor:pointer; font-weight:700; font-size:12px;}
  .stage-opt.active{background:var(--gold); color:#2a1c00; border-color:var(--gold);}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions .btn{flex:1; padding:13px 0; border-radius:10px; border:none; font-size:14px; font-weight:800; cursor:pointer;}
  .btn-save{background:var(--gold); color:#2a1c00;}
  .btn-cancel{background:transparent; border:1px solid var(--card-border); color:var(--text-dim);}

  /* exit confirm modal */
  .exit-modal{background:var(--bg2); border:1px solid var(--card-border); border-radius:16px; padding:20px; max-width:340px; width:90%; text-align:center;}
  .exit-modal p{color:var(--text-dim); font-size:14px; margin:0 0 16px;}
  .exit-actions{display:flex; gap:10px;}
  .exit-actions .btn{flex:1; padding:13px 0; border-radius:10px; border:none; font-size:14px; font-weight:800; cursor:pointer;}
  .btn-confirm-exit{background:var(--red); color:#2a0704;}
  .btn-cancel-exit{background:transparent; border:1px solid var(--card-border); color:var(--text-dim);}

  .goodbye{position:fixed; inset:0; background:var(--bg1); display:flex; align-items:center; justify-content:center; z-index:100; text-align:center; padding:20px;}

  /* ---------- update toast ---------- */
  .update-toast{
    position:fixed; left:12px; right:12px; bottom:14px; z-index:150;
    background:linear-gradient(160deg, var(--card), #0e1836); border:1px solid var(--gold);
    border-radius:14px; padding:12px 14px; display:none; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); max-width:560px; margin:0 auto;
  }
  .update-toast.show{display:flex;}
  .update-toast span{font-size:13px; font-weight:700; color:var(--gold-soft);}
  .update-toast button{
    background:var(--gold); color:#2a1c00; border:none; border-radius:9px; padding:9px 14px;
    font-weight:800; font-size:13px; cursor:pointer; flex-shrink:0;
  }

  /* ---------- splash screens ---------- */
  .splash{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:var(--bg1); opacity:1; transition:opacity .5s ease;
  }
  .splash.fade-out{opacity:0; pointer-events:none;}
  .splash.hidden{display:none;}
  #splashImage{background:#000;}
  #splashImage img{width:100%; height:100%; object-fit:contain;}
  #splashCredits{
    background:radial-gradient(circle at 50% 30%, var(--bg2), var(--bg1) 75%);
    flex-direction:column; text-align:center; padding:20px;
  }
  .credits-logo{font-size:15px; letter-spacing:4px; color:var(--gold-soft); font-weight:800; margin-bottom:18px; opacity:0.85;}
  .credits-line{width:64px; height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); margin:0 auto 22px;}
  .credits-made{font-size:13px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:10px;}
  .credits-name{font-size:28px; font-weight:900; color:var(--text); margin-bottom:22px;}
  .credits-super{font-size:12px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;}
  .credits-supervisor{font-size:19px; font-weight:800; color:var(--gold-soft);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ================= AUDIO ================= */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, start, dur, vol, type){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
  gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + start);
  osc.stop(audioCtx.currentTime + start + dur + 0.05);
}
// Electronic airhorn: stacked sawtooth oscillators with a quick pitch-rise, at max volume.
function playStartSound(){
  ensureAudio(); if(!audioCtx) return;
  const ctx = audioCtx;
  const dur = 0.8;
  [1, 1.005, 0.5, 2.0].forEach((mult, idx)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    const baseFreq = 220 * mult;
    osc.frequency.setValueAtTime(baseFreq * 0.6, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq, ctx.currentTime + 0.08);
    const vol = idx===2 ? 0.5 : (idx===3 ? 0.25 : 0.85);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(vol, ctx.currentTime + dur - 0.18);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur + 0.05);
  });
}

/* runtime */
let raceStarted = false;
let raceStartTs = 0;
const runtime = {};
function rtKey(stationId, playerId){ return stationId+'::'+playerId; }
function freshRT(){
  return { attempt1Time:null, attempt2StartTs:null, attempt2Time:null, finished:false, finishTime:null, rank:null, provisional:false, quality:'', comment:'' };
}
function getRT(stationId, playerId){
  const k = rtKey(stationId, playerId);
  if(!runtime[k]) runtime[k] = freshRT();
  return runtime[k];
}
function resetRuntime(){
  rows.forEach(r=>{ runtime[rtKey(r.stationId,r.playerId)] = freshRT(); });
}
resetRuntime();

let tickInterval = null;

/* ================= HELPERS ================= */
function fmtTime(totalSeconds){
  if(totalSeconds < 0) totalSeconds = 0;
  const m = Math.floor(totalSeconds/60);
  const s = Math.floor(totalSeconds%60);
  const cs = Math.floor((totalSeconds*100)%100);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}
function parseTime(str){
  if(!str) return 0;
  str = str.trim();
  let m=0, rest=str;
  if(str.includes(':')){ const p = str.split(':'); m = parseFloat(p[0])||0; rest = p[1]||'0'; }
  const s = parseFloat(rest)||0;
  return m*60+s;
}
function getStation(stationId){ return stations.find(s=>s.id===stationId); }
function liveElapsed(){ return (performance.now() - raceStartTs)/1000; }

/* ================= RANKING ================= */
function recomputeRanking(stationId){
  const st = getStation(stationId);
  const stRows = rows.filter(r=>r.stationId===stationId);
  if(st.players.length === 1){
    const r = stRows[0];
    const rt = getRT(r.stationId, r.playerId);
    if(rt.finished){ rt.rank = rt.finishTime < st.japanTime ? 1 : 2; rt.provisional = false; }
    return;
  }
  const rts = stRows.map(r=>({ r, rt:getRT(r.stationId, r.playerId) }));
  const finishedCount = rts.filter(x=>x.rt.finished).length;
  if(finishedCount === 0) return;
  if(finishedCount < rts.length){
    rts.forEach(x=>{
      if(x.rt.finished){ x.rt.rank = x.rt.finishTime < st.japanTime ? 1 : 2; x.rt.provisional = true; }
    });
  } else {
    const entries = rts.map(x=>({ key:x.r.playerId, time:x.rt.finishTime }));
    entries.push({ key:'__japan__', time: st.japanTime });
    entries.sort((a,b)=>a.time-b.time);
    entries.forEach((e,i)=>{
      if(e.key==='__japan__') return;
      const target = rts.find(x=>x.r.playerId===e.key);
      target.rt.rank = i+1; target.rt.provisional = false;
    });
  }
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  const allDone = rows.every(r=> getRT(r.stationId,r.playerId).finished);

  let html = `
    <div class="topbar">
      <div class="icon-btn exit" onclick="openExit()">✕</div>
      <div class="icon-btn" onclick="toggleOrientation()">⤾</div>
      <h1 class="title">RACE TIMER</h1>
      <div class="icon-btn" onclick="openSettings()">⚙</div>
      <div class="icon-btn" onclick="restartRace()">↺</div>
    </div>
  `;

  if(!raceStarted){
    html += `<button class="enter-btn" onclick="startRace()">${t('enter')}</button>`;
  } else {
    html += `<div class="race-banner ${allDone?'done':''}">${allDone ? t('raceDone') : t('raceRunning')}</div>`;
    const anyFinished = rows.some(r=> getRT(r.stationId,r.playerId).finished);
    if(anyFinished){
      html += `<button class="export-btn" onclick="exportToExcel()">${t('exportBtn')}</button>`;
    }
  }

  rows.forEach((r,i)=>{
    const st = getStation(r.stationId);
    const rt = getRT(r.stationId, r.playerId);
    const displayTime = computeDisplayTime(st, rt);

    let attemptLabel = '';
    if(st.stages===2){
      if(rt.finished){ attemptLabel = `${t('a1short')}: ${rt.attempt1Time.toFixed(2)}s • ${t('a2short')}: ${rt.attempt2Time.toFixed(2)}s`; }
      else if(rt.attempt1Time===null){ attemptLabel = t('attempt1'); }
      else if(rt.attempt2StartTs===null){ attemptLabel = `${t('a1short')}: ${rt.attempt1Time.toFixed(2)}s — ${t('waitAttempt2')}`; }
      else { attemptLabel = t('attempt2'); }
    }

    let diffBadge = '', rankTag = '', provisional = '';
    if(rt.finished && rt.rank !== null){
      if(st.stages===2){
        // show the diff for BOTH attempts vs Japan
        const d1 = rt.attempt1Time - st.japanTime;
        const d2 = rt.attempt2Time - st.japanTime;
        const b1ahead = d1 <= 0, b2ahead = d2 <= 0;
        const s1 = d1>0?'+':'-', s2 = d2>0?'+':'-';
        diffBadge = `<span class="diff-badge ${b1ahead?'ahead':'behind'}">${t('a1short')} ${s1}${Math.abs(d1).toFixed(2)}s</span>`
                  + `<span class="diff-badge ${b2ahead?'ahead':'behind'}">${t('a2short')} ${s2}${Math.abs(d2).toFixed(2)}s</span>`;
      } else {
        const diff = rt.finishTime - st.japanTime; // positive = slower, negative = faster
        const ahead = diff <= 0;
        const sign = diff > 0 ? '+' : '-';
        diffBadge = `<span class="diff-badge ${ahead?'ahead':'behind'}">${sign}${Math.abs(diff).toFixed(2)}s</span>`;
      }
      const rc = rt.rank===1?'r1':(rt.rank===2?'r2':'r3');
      const rankWord = rt.rank===1?t('r1'):(rt.rank===2?t('r2'):t('r3'));
      rankTag = `<span class="rank-tag show ${rc}">${rankWord}</span>`;
      if(rt.provisional) provisional = `<span class="provisional-tag">${t('provisional')}</span>`;
    }

    let actionHtml = '';
    if(raceStarted && !rt.finished){
      let label, cls;
      if(st.stages===2 && rt.attempt1Time===null){
        label = `${t('endAttempt1')} (${r.index})`; cls = 'finish-btn stage1';
      } else if(st.stages===2 && rt.attempt2StartTs===null){
        label = `${t('startAttempt2')} (${r.index})`; cls = 'finish-btn stage1';
      } else {
        label = `${t('finish')} (${r.index})`; cls = 'finish-btn';
      }
      actionHtml = `<button class="${cls}" onclick="pressRow(${r.index})">${label}</button>`;
    } else if(rt.finished){
      actionHtml = `<div class="done-label">${t('done')}</div>
        <div class="quality-row">
          <input type="number" min="0" max="100" class="quality-input" placeholder="${t('qualityPlaceholder')}"
            value="${rt.quality}" oninput="updateQuality('${r.stationId}','${r.playerId}',this.value)">
          <input type="text" class="comment-input" placeholder="${t('commentPlaceholder')}"
            value="${rt.comment}" oninput="updateComment('${r.stationId}','${r.playerId}',this.value)">
        </div>`;
    }

    const rowClass = 'prow' + (rt.finished?' finished':'') + (r.sameGroup?' same-game':'');
    html += `<div class="${rowClass}">
      <div class="prow-line1">
        <span class="idx">${r.index}.</span>
        <span>${r.playerName}</span>
        <span class="station">— ${r.stationName}</span>
      </div>
      <div class="prow-line2">
        <span class="ptime" id="timer-${r.stationId}-${r.playerId}">${fmtTime(displayTime)}</span>
        <span class="psec" id="sec-${r.stationId}-${r.playerId}">(${displayTime.toFixed(2)}s)</span>
        <span class="stage-tag">🇯🇵 ${fmtTime(st.japanTime)}</span>
        ${attemptLabel ? `<span class="stage-tag">${attemptLabel}</span>` : ''}
        ${diffBadge}
        ${rankTag}
        ${provisional}
      </div>
      ${actionHtml}
    </div>`;

    // divider between different stations (not within same station group)
    const next = rows[i+1];
    if(next && next.stationId !== r.stationId){
      html += `<hr class="row-divider">`;
    }
  });

  html += `<div class="kbd-hint">${t('kbdHint')}</div>`;

  app.innerHTML = html;
}

// Computes the number that should currently be displayed for a row.
// stages===1: simple single timer from the global race start, frozen once finished.
// stages===2: attempt 1 runs from the global race start until the player ends it;
//             the clock then freezes (paused) until the player starts attempt 2
//             (its own individual start time); attempt 2 then runs and freezes
//             once ended — that final attempt-2 value is the player's official time.
function computeDisplayTime(st, rt){
  if(st.stages !== 2){
    if(rt.finished) return rt.finishTime;
    return raceStarted ? liveElapsed() : 0;
  }
  if(rt.attempt1Time === null){
    return raceStarted ? liveElapsed() : 0;
  }
  if(rt.attempt2StartTs === null){
    return rt.attempt1Time;
  }
  if(rt.attempt2Time === null){
    return (performance.now() - rt.attempt2StartTs)/1000;
  }
  return rt.attempt2Time;
}

/* ================= ACTIONS ================= */
function startRace(){
  ensureAudio();
  raceStarted = true;
  resetRuntime();
  raceStartTs = performance.now();
  playStartSound();
  render();
  ensureTicker();
}

function pressRow(index){
  if(!raceStarted) return;
  const r = rows[index-1];
  if(!r) return;
  const st = getStation(r.stationId);
  const rt = getRT(r.stationId, r.playerId);
  if(rt.finished) return;
  ensureAudio();

  if(st.stages !== 2){
    rt.finished = true;
    rt.finishTime = liveElapsed();
    recomputeRanking(r.stationId);
    playFinishSound();
  } else if(rt.attempt1Time === null){
    // end of attempt 1
    rt.attempt1Time = liveElapsed();
    playFinishSound();
  } else if(rt.attempt2StartTs === null){
    // start of attempt 2 (player's own individual start)
    rt.attempt2StartTs = performance.now();
    playAttemptStartSound();
  } else {
    // end of attempt 2 -> official time is the BEST (fastest) of the two attempts
    rt.attempt2Time = (performance.now() - rt.attempt2StartTs)/1000;
    rt.finished = true;
    rt.finishTime = Math.min(rt.attempt1Time, rt.attempt2Time);
    recomputeRanking(r.stationId);
    playFinishSound();
  }
  render();
}

function restartRace(){
  raceStarted = false;
  resetRuntime();
  if(tickInterval){ clearInterval(tickInterval); tickInterval=null; }
  render();
}

/* ================= EXCEL EXPORT ================= */
function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    alert(lang==='ar' ? 'تعذّر تحميل مكتبة Excel — تأكد إنك متصل بالإنترنت وجرّب تاني.' : 'Could not load the Excel library — make sure you are online and try again.');
    return;
  }
  const data = rows.map(r=>{
    const st = getStation(r.stationId);
    const rt = getRT(r.stationId, r.playerId);
    const rankWord = rt.rank===1?t('r1'):(rt.rank===2?t('r2'):(rt.rank===3?t('r3'):''));
    const row = {};
    row[t('colIndex')] = r.index;
    row[t('colPlayer')] = r.playerName;
    row[t('colStation')] = r.stationName;
    row[t('colAttempts')] = st.stages;
    row[t('colAttempt1')] = rt.attempt1Time!==null ? Number(rt.attempt1Time.toFixed(2)) : '';
    row[t('colAttempt2')] = rt.attempt2Time!==null ? Number(rt.attempt2Time.toFixed(2)) : '';
    row[t('colFinalTime')] = rt.finished ? fmtTime(rt.finishTime) : '';
    row[t('colFinalSeconds')] = rt.finished ? Number(rt.finishTime.toFixed(2)) : '';
    row[t('colJapanTime')] = fmtTime(st.japanTime);
    row[t('colDiff')] = rt.finished ? Number((rt.finishTime - st.japanTime).toFixed(2)) : '';
    row[t('colRank')] = rankWord;
    row[t('colQuality')] = rt.quality!=='' ? Number(rt.quality) : '';
    row[t('colComment')] = rt.comment || '';
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [
    {wch:4},{wch:14},{wch:22},{wch:10},{wch:14},{wch:14},
    {wch:14},{wch:16},{wch:14},{wch:16},{wch:10},{wch:12},{wch:30}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Results');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  XLSX.writeFile(wb, `race-results-${stamp}.xlsx`);
}

function ensureTicker(){
  if(tickInterval) return;
  tickInterval = setInterval(()=>{
    if(!raceStarted) return;
    rows.forEach(r=>{
      const st = getStation(r.stationId);
      const rt = getRT(r.stationId, r.playerId);
      if(!rt.finished){
        const t = computeDisplayTime(st, rt);
        const el = document.getElementById('timer-'+r.stationId+'-'+r.playerId);
        const el2 = document.getElementById('sec-'+r.stationId+'-'+r.playerId);
        if(el) el.textContent = fmtTime(t);
        if(el2) el2.textContent = '('+t.toFixed(2)+'s)';
      }
    });
  }, 40);
}

  document.getElementById('exitOverlay').classList.add('show');
}
function cancelExit(){ document.getElementById('exitOverlay').classList.remove('show'); }
function confirmExit(){
  document.getElementById('exitOverlay').classList.remove('show');
  // Overwrite the current history entry so a stray back-gesture doesn't
  // land back on the app's running state.
  try{ history.replaceState(null, '', window.location.href); }catch(e){}
  document.body.innerHTML = `<div class="goodbye"><div><h2>${t('appClosed')}</h2><p style="color:#9aa4c7; max-width:280px; margin:10px auto 0;">${t('canCloseNow')}</p></div></div>`;
}

/* ================= ORIENTATION ================= */
function toggleOrientation(){
  document.body.classList.toggle('landscape-mode');
  if(screen.orientation && screen.orientation.lock){
    const isLandscape = document.body.classList.contains('landscape-mode');
    screen.orientation.lock(isLandscape ? 'landscape' : 'portrait').catch(()=>{});
  }
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ if(!raceStarted) startRace(); return; }
  if(e.key >= '1' && e.key <= '9'){
    const idx = parseInt(e.key,10);
    if(idx <= rows.length) pressRow(idx);
  } else if(e.key === '0' || e.key.toLowerCase() === 'r'){
    restartRace();
  }
});

/* ================= PWA / SERVICE WORKER ================= */
let waitingWorker = null;
function showUpdateToast(){
  document.getElementById('updateToast').classList.add('show');
}
function applyUpdate(){
  if(waitingWorker){
    waitingWorker.postMessage('SKIP_WAITING');
  }
  document.getElementById('updateToast').classList.remove('show');
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      // a new SW may already be waiting from a previous visit
      if(reg.waiting){ waitingWorker = reg.waiting; showUpdateToast(); }
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            waitingWorker = newWorker;
            showUpdateToast();
          }
        });
      });
      // periodically check for a newer sw.js / index.html
      setInterval(()=>{ reg.update(); }, 60*1000);
    }).catch(()=>{});
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

/* ================= INIT ================= */
document.getElementById('app').style.display = 'none';

function runSplashSequence(){
  const imgSplash = document.getElementById('splashImage');
  const creditsSplash = document.getElementById('splashCredits');
  const app = document.getElementById('app');

  setTimeout(()=>{
    imgSplash.classList.add('fade-out');
    creditsSplash.classList.remove('hidden');
    setTimeout(()=>{ imgSplash.classList.add('hidden'); }, 500);
  }, 5000);

  setTimeout(()=>{
    creditsSplash.classList.add('fade-out');
    app.style.display = '';
    render();
    setTimeout(()=>{ creditsSplash.classList.add('hidden'); }, 500);
  }, 12000);
}
runSplashSequence();
</script>
